    - data:
        code: "function main() {\n    // Constants\n    const AF_UNIX = 1\n    const\
          \ SOCK_STREAM = 1\n    const AT_FDCWD = -100\n    const O_RDONLY = 0o000000\n\
          \    const O_DIRECTORY = 0o200000\n    const SOL_SOCKET = 1\n    const SCM_RIGHTS\
          \ = 1\n\n    const sock_addr = '\\x00test';\n\n    // Typedefs\n    const\
          \ sa_family_t = koffi.alias('sa_family_t', 'uint16_t');\n    const socklen_t\
          \ = koffi.alias('socklen_t', 'uint32_t');\n    const ssize_t = koffi.alias('ssize_t',\
          \ 'int64_t');\n\n    // Structures\n    const sockaddr_un = koffi.struct('sockaddr_un',\
          \ {\n        sun_family: 'sa_family_t',\n        sun_path: koffi.array('char',\
          \ 108, 'String')\n    });\n\n    const iovec = koffi.struct('iovec', {\n\
          \        iov_base: 'void *',\n        iov_len: 'size_t'\n    })\n\n    const\
          \ cmsghdr = koffi.struct('cmsghdr', {\n        cmsg_len: 'size_t',\n   \
          \     cmsg_level: 'int',\n        cmsg_type: 'int',\n        \n        //\
          \ For single fd SCM_RIGHTS\n        fd: 'int',\n    })\n\n    const msghdr\
          \ = koffi.struct('msghdr', {\n        msg_name: 'void *',\n        msg_namelen:\
          \ 'socklen_t',\n        msg_iov: 'iovec *',\n        msg_iovlen: 'size_t',\n\
          \        msg_control: 'cmsghdr *',\n        msg_controllen: 'size_t',\n\
          \        msg_flags: 'int'\n    });\n\n    const l = koffi.load('libc.so.6');\n\
          \n    // Functions\n    const socket = l.func('int socket(int domain, int\
          \ type, int protocol)');\n    const bind = l.func('int bind(int sockfd,\
          \ sockaddr_un *addr, socklen_t addrlen)');\n    const listen = l.func('int\
          \ listen(int sockfd, int backlog)');\n    const accept = l.func('int accept(int\
          \ sockfd, sockaddr_un *addr, socklen_t *addrlen)');\n    const openat =\
          \ l.func('int openat(int dirfd, const char *pathname, int flags)');\n  \
          \  const sendmsg = l.func('ssize_t sendmsg(int sockfd, msghdr *msg, int\
          \ flags)');\n\n    dirfd = openat(AT_FDCWD, '.', O_RDONLY | O_DIRECTORY)\n\
          \    console.log(dirfd, koffi.errno());\n\n    const sfd = socket(AF_UNIX,\
          \ SOCK_STREAM, 0);\n    console.log(sfd, koffi.errno());\n\n    err = bind(sfd,\
          \ {sun_family: AF_UNIX, sun_path: sock_addr}, 2 + sock_addr.length);\n \
          \   console.log(err, koffi.errno());\n\n    err = listen(sfd, 1);\n    console.log(err,\
          \ koffi.errno());\n\n    fd = accept(sfd, null, null);\n    console.log(fd,\
          \ koffi.errno());\n\n    err = sendmsg(fd, {\n        msg_name: null,\n\
          \        msg_namelen: 0,\n        msg_iov: {\n            iov_base: 'X',\n\
          \            iov_len: 1\n        },\n        msg_iovlen: 1,\n        msg_control:\
          \ {\n            cmsg_len: koffi.sizeof('cmsghdr'),\n            cmsg_level:\
          \ SOL_SOCKET,\n            cmsg_type: SCM_RIGHTS,\n            fd: dirfd\n\
          \        },\n        msg_controllen: koffi.sizeof('cmsghdr'),\n        msg_flags:\
          \ 0,\n    }, 0)\n    console.log(err, koffi.errno());\n    return {\"a\"\
          :1,\"b\":2};\n}"
        code_language: javascript
